name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Buildozer
        run: |
          pip install --upgrade pip==24.0
          pip install buildozer cython==0.29.36

      - name: Fix Android SDK paths
        run: |
          mkdir -p ~/.buildozer/android/platform/
          ln -sfn /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk || true
          ln -sfn /usr/local/lib/android/sdk/ndk/27.3.13750724 ~/.buildozer/android/platform/android-ndk-r28c || true

      - name: Patch pip bug
        run: |
          buildozer android p4a -- --help || true
          find ~/.buildozer -name build.py -type f -exec sed -i 's/pip install -U pip/pip install pip==24.0/g' {} \;
          find ~/.buildozer -name build.py -type f -exec sed -i 's/pip install --upgrade pip/pip install pip==24.0/g' {} \;

      - name: Build APK
        run: |
          buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
          if-no-files-found: error
