name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libtool libtool-bin autoconf automake cmake pkg-config libffi-dev libssl-dev libltdl-dev libtinfo5

      - name: Install Buildozer
        run: |
          pip install --upgrade pip==24.0
          pip install buildozer cython==0.29.36

      - name: Clean and Patch P4A
        run: |
          rm -rf ~/.buildozer .buildozer bin
          buildozer init || true
          # Questo crea la struttura
          buildozer android p4a -- --help || true
          # FIX PIP 26 -> blocca pip a 24.0 ovunque in p4a
          find ~/.buildozer -type f -name "*.py" | xargs sed -i 's/pip install -U pip/pip install pip==24.0/g' 2>/dev/null || true
          find ~/.buildozer -type f -name "*.py" | xargs sed -i 's/--upgrade pip/==24.0/g' 2>/dev/null || true
          # FIX LICENZE + AIDL
          SDK=~/.buildozer/android/platform/android-sdk
          SYS_SDK=/usr/local/lib/android/sdk
          mkdir -p $SDK/licenses
          cp $SYS_SDK/licenses/* $SDK/licenses/ 2>/dev/null || true
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          $SYS_SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platform-tools" "build-tools;34.0.0" || true
          ls $SDK/build-tools/34.0.0/aidl && echo "AIDL OK"

      - name: Build APK
        run: buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
