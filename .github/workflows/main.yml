name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Fix buildozer.spec
        run: |
          [ -f buildozer.spec ] || buildozer init || true
          sed -i 's/^android.api =.*/android.api = 34/' buildozer.spec || echo "android.api = 34" >> buildozer.spec
          if grep -q "build_tools_version" buildozer.spec; then
            sed -i 's/^#*.*build_tools_version.*/android.build_tools_version = 34.0.0/' buildozer.spec
          else
            echo "android.build_tools_version = 34.0.0" >> buildozer.spec
          fi
          cat buildozer.spec | grep -E "android.api|build_tools"

      - name: Build APK con Docker ufficiale Kivy
        run: |
          # Usa l'immagine ufficiale, non quella rotta con il PPA
          docker run --rm \
            -v $PWD:/home/user/hostcwd \
            -v $PWD/.buildozer:/home/user/.buildozer \
            kivy/buildozer:master \
            android debug
          sudo chown -R $USER:$USER bin .buildozer 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
