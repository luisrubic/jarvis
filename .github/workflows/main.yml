name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    # ubuntu-latest garantisce l'ambiente più aggiornato e i runtime Node più recenti
    runs-on: ubuntu-latest 

    steps:
      # Aggiornato alla versione v5 (Node 20+)
      - uses: actions/checkout@v5 

      # Aggiornato alla versione v5 (Risolve la deprecation di Java v4 nei log)
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK inside Fixed Docker Environment
        run: |
          cat > run_buildozer.sh <<'EOS'
          #!/bin/bash
          set -e
          
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Configurazione per bloccare SDK/NDK a versioni stabili (API 33, NDK 25b)
          if [ -f buildozer.spec ]; then
            sed -i 's/^#* *android.api =.*/android.api = 33/' buildozer.spec
            sed -i 's/^#* *android.minapi =.*/android.minapi = 21/' buildozer.spec
            sed -i 's/^#* *android.ndk =.*/android.ndk = 25b/' buildozer.spec
            sed -i 's/^#* *android.build_tools_version =.*/android.build_tools_version = 33.0.0/' buildozer.spec
          fi

          # Scrittura licenze Android SDK
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c1051b8f6b012\n" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

          export ALLOW_ROOT=1
          buildozer android debug
          EOS

          chmod +x run_buildozer.sh

          # Esecuzione isolata nel container ufficiale di Buildozer
          docker run --rm \
            -v $PWD:/home/user/hostcwd \
            -w /home/user/hostcwd \
            --entrypoint bash \
            kivy/buildozer:master \
            ./run_buildozer.sh

          sudo chown -R $USER:$USER bin 2>/dev/null || true

      # Aggiornato alla versione v5 (Node aggiornato e compatibile)
      - name: Upload Finished APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
