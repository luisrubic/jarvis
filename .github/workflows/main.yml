name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Fix buildozer.spec
        run: |
          [ -f buildozer.spec ] || buildozer init || true
          sed -i 's/^android.api =.*/android.api = 34/' buildozer.spec || echo "android.api = 34" >> buildozer.spec
          sed -i 's/^#*.*build_tools_version.*/android.build_tools_version = 34.0.0/' buildozer.spec || echo "android.build_tools_version = 34.0.0" >> buildozer.spec

      - name: Build APK
        run: |
          cat > build_inside_docker.sh <<'EOS'
          #!/bin/bash
          set -e
          echo "=== Patch Buildozer per non chiedere root ==="
          # Trova il file buildozer e rimuovi il check root
          BZ_FILE=$(python3 -c "import buildozer; print(buildozer.__file__)" 2>/dev/null || find /home -name "__init__.py" | grep buildozer | head -1)
          echo "Buildozer file: $BZ_FILE"
          # Sostituisce la funzione check_root con return
          sed -i 's/def check_root(self):.*/def check_root(self):\n        return True/' $BZ_FILE || true
          sed -i '/def check_root/,/return/ { /Are you sure/d; /input/d; /cont =/d; }' $BZ_FILE || true
          # Metodo brutale ma sicuro: commenta tutto dentro check_root
          python3 << 'PY'
          import pathlib
          p = pathlib.Path("__import__('buildozer').__file__".strip())
          # trova file via import
          import buildozer
          f = pathlib.Path(buildozer.__file__)
          text = f.read_text()
          text = text.replace("def check_root(self):", "def check_root(self):\n        return True\n    def _old_check_root(self):")
          f.write_text(text)
          print("Patched", f)
          PY

          SDK=~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          echo "=== Install 32bit libs ==="
          dpkg --add-architecture i386 || true
          apt-get update -y -qq
          apt-get install -y libc6:i386 libstdc++6:i386 zlib1g:i386 || true

          echo "=== Avvio Compilazione APK ==="
          buildozer android debug
          EOS
          chmod +x build_inside_docker.sh

          docker run --rm \
            -v $PWD:/home/user/hostcwd \
            -w /home/user/hostcwd \
            --entrypoint bash \
            kivy/buildozer:latest \
            ./build_inside_docker.sh

          sudo chown -R $USER:$USER bin 2>/dev/null || true
          ls -lh bin/

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
