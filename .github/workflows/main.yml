name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libtool libtool-bin autoconf automake cmake pkg-config libffi-dev libssl-dev libltdl-dev libtinfo5 libc6-i386 lib32stdc++6 lib32z1

      - name: Install Buildozer
        run: |
          pip install --upgrade pip==24.0
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          # Fix pip 26
          grep -q "android.api" buildozer.spec || echo "android.api = 34" >> buildozer.spec
          sed -i 's/android.api = 33/android.api = 34/g' buildozer.spec || true
          rm -rf .buildozer bin
          buildozer init || true
          find ~/.buildozer -type f -name "*.py" | xargs sed -i 's/pip install -U pip/pip install pip==24.0/g' 2>/dev/null || true
          
          # Accetta licenze PRIMA
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "y" | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Avvia buildozer una volta per fargli scaricare SDK, poi lo patchiamo
          buildozer android debug || true
          
          # ORA PATCHIAMO DOPO CHE HA SCARICATO
          SYS=/usr/local/lib/android/sdk
          P4A=~/.buildozer/android/platform/android-sdk
          mkdir -p $P4A/build-tools
          rm -rf $P4A/build-tools/37.0.0 $P4A/build-tools/36* $P4A/build-tools/35*
          if [ ! -d "$P4A/build-tools/34.0.0" ]; then
            cp -r $SYS/build-tools/34.0.0 $P4A/build-tools/
          fi
          
          # Patch AIDL wrapper
          for d in $P4A/build-tools/*; do
            if [ -f "$d/aidl" ] && [ ! -f "$d/aidl.real" ]; then
              mv $d/aidl $d/aidl.real
              printf '#!/bin/bash\nDIR="$(dirname "$0")"\nif [ $# -eq 0 ]; then exit 0; fi\nexec "$DIR/aidl.real" "$@"\n' > $d/aidl
              chmod +x $d/aidl $d/aidl.real
            fi
          done
          
          echo "=== FINAL CHECK ==="
          ls $P4A/build-tools/
          $P4A/build-tools/34.0.0/aidl && echo "AIDL OK"
          
          # Build finale vera
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
