name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libtool libtool-bin autoconf automake cmake pkg-config libffi-dev libssl-dev libltdl-dev libtinfo5

      - name: Install Buildozer
        run: |
          pip install --upgrade pip==24.0
          pip install buildozer cython==0.29.36

      - name: Fix SDK - Create writable SDK with links
        run: |
          grep -q "android.api" buildozer.spec || echo "android.api = 34" >> buildozer.spec
          sed -i 's/android.api = 33/android.api = 34/g' buildozer.spec || true
          grep -q "android.minapi" buildozer.spec || echo "android.minapi = 24" >> buildozer.spec
          
          rm -rf ~/.buildozer .buildozer bin
          buildozer init || true
          buildozer android p4a -- --help || true
          find ~/.buildozer -type f -name "*.py" | xargs sed -i 's/pip install -U pip/pip install pip==24.0/g' 2>/dev/null || true

          SYS=/usr/local/lib/android/sdk
          P4A=~/.buildozer/android/platform/android-sdk
          
          # Crea SDK scrivibile tuo, non di sistema
          rm -rf $P4A
          mkdir -p $P4A/tools/bin
          mkdir -p $P4A/licenses
          
          # Linka componenti dal sistema
          ln -s $SYS/build-tools $P4A/build-tools
          ln -s $SYS/platforms $P4A/platforms
          ln -s $SYS/platform-tools $P4A/platform-tools
          ln -s $SYS/cmdline-tools $P4A/cmdline-tools
          ln -s $SYS/emulator $P4A/emulator 2>/dev/null || true
          ln -s $SYS/extras $P4A/extras 2>/dev/null || true
          
          # sdkmanager vecchio percorso
          ln -s $SYS/cmdline-tools/latest/bin/sdkmanager $P4A/tools/bin/sdkmanager
          
          # Licenze
          cp $SYS/licenses/* $P4A/licenses/ 2>/dev/null || true
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $P4A/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $P4A/licenses/android-sdk-license
          
          echo "=== CHECK ==="
          ls -l $P4A/
          ls -l $P4A/tools/bin/
          ls $P4A/build-tools/ | head
          ls $P4A/build-tools/34.0.0/ | grep aidl
          $P4A/build-tools/34.0.0/aidl --version && echo "AIDL OK"

      - name: Build APK
        env:
          ANDROIDAPI: "34"
        run: buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
