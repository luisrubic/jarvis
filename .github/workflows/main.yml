name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer Cython==0.29.33

      - name: Build APK
        run: |
          buildozer android debug || true
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          $SDK/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
