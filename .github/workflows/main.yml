name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libtool libtool-bin autoconf automake cmake pkg-config libffi-dev libssl-dev libltdl-dev libtinfo5 libc6-i386 lib32stdc++6 lib32z1

      - name: Install Buildozer
        run: |
          pip install --upgrade pip==24.0
          pip install buildozer cython==0.29.36

      - name: Fix SDK - Use ONLY 34.0.0 and patch aidl
        run: |
          grep -q "android.api" buildozer.spec || echo "android.api = 34" >> buildozer.spec
          sed -i 's/android.api = 33/android.api = 34/g' buildozer.spec || true
          
          rm -rf ~/.buildozer .buildozer bin
          buildozer init || true
          buildozer android p4a -- --help || true
          find ~/.buildozer -type f -name "*.py" | xargs sed -i 's/pip install -U pip/pip install pip==24.0/g' 2>/dev/null || true

          SYS=/usr/local/lib/android/sdk
          P4A=~/.buildozer/android/platform/android-sdk
          rm -rf $P4A
          mkdir -p $P4A/tools/bin $P4A/licenses
          
          # COPIA SOLO 34.0.0 - cancella 37, 36, 35 che danno problemi
          mkdir -p $P4A/build-tools
          cp -r $SYS/build-tools/34.0.0 $P4A/build-tools/
          # opzionale, copia anche 33 se c'è
          cp -r $SYS/build-tools/33.0.2 $P4A/build-tools/ 2>/dev/null || true
          
          ln -s $SYS/platforms $P4A/platforms
          ln -s $SYS/platform-tools $P4A/platform-tools
          ln -s $SYS/cmdline-tools $P4A/cmdline-tools
          ln -s $SYS/cmdline-tools/latest/bin/sdkmanager $P4A/tools/bin/sdkmanager
          cp $SYS/licenses/* $P4A/licenses/ 2>/dev/null || true
          
          # Patch AIDL per far tornare 0
          for d in $P4A/build-tools/*; do
            if [ -f "$d/aidl" ]; then
              mv $d/aidl $d/aidl.real
              echo '#!/bin/bash
          DIR="$(dirname "$0")"
          if [ $# -eq 0 ]; then exit 0; fi
          exec "$DIR/aidl.real" "$@"' > $d/aidl
              chmod +x $d/aidl
              chmod +x $d/aidl.real
            fi
          done
          
          echo "=== FINAL CHECK ==="
          ls $P4A/build-tools/
          $P4A/build-tools/34.0.0/aidl
          echo "Exit code: $? (deve essere 0)"
          ldd $P4A/build-tools/34.0.0/aidl.real | head

      - name: Build APK
        env:
          ANDROIDAPI: "34"
        run: buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
