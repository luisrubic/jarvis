name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libtool libtool-bin autoconf automake cmake pkg-config libffi-dev libssl-dev libltdl-dev libtinfo5 libc6-i386 lib32stdc++6 lib32z1

      - name: Install Buildozer
        run: |
          pip install --upgrade pip==24.0
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          # --- 1. Config buildozer.spec ---
          sed -i 's/^android.api =.*/android.api = 34/' buildozer.spec || echo "android.api = 34" >> buildozer.spec
          sed -i 's/^android.minapi =.*/android.minapi = 24/' buildozer.spec || echo "android.minapi = 24" >> buildozer.spec
          sed -i 's/^android.ndk =.*/android.ndk = 25b/' buildozer.spec || true

          rm -rf .buildozer bin
          buildozer init || true

          # --- 2. PATCH PIP 26 -> Il bug che ti ha dato 51k righe ---
          # Questo DEVE essere fatto prima e dopo il download dell'SDK
          find ~/.buildozer -type f -name "*.py" -exec sed -i 's/pip install -U pip/pip install pip==24.0/g' {} \; 2>/dev/null || true

          # --- 3. Primo avvio per scaricare SDK (fallirà su aidl, è VOLUTO) ---
          echo "y" | buildozer android debug || echo "Primo avvio fallito come previsto, ora patcho..."

          # --- 4. FIX SDK DEFINITIVO ---
          SYS=/usr/local/lib/android/sdk
          P4A=~/.buildozer/android/platform/android-sdk

          # Licenze
          mkdir -p $P4A/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $P4A/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $P4A/licenses/android-sdk-license
          echo "y" | $P4A/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

          # build-tools: cancella 37.0.0 che da "Aidl cannot be executed" e tieni solo 34.0.0
          ls $P4A/build-tools/ || echo "build-tools mancante"
          rm -rf $P4A/build-tools/37.* $P4A/build-tools/36.* $P4A/build-tools/35.*
          
          if [ ! -d "$P4A/build-tools/34.0.0" ]; then
            echo "Copio 34.0.0 dal sistema..."
            mkdir -p $P4A/build-tools
            cp -r $SYS/build-tools/34.0.0 $P4A/build-tools/
          fi

          # Patch AIDL wrapper: se chiamato senza args torna 0 invece di 1
          for d in $P4A/build-tools/*; do
            if [ -f "$d/aidl" ] && [ ! -f "$d/aidl.real" ]; then
              echo "Patching $d/aidl"
              mv $d/aidl $d/aidl.real
              printf '#!/bin/bash\nDIR="$(dirname "$0")"\nif [ $# -eq 0 ]; then exit 0; fi\nexec "$DIR/aidl.real" "$@"\n' > $d/aidl
              chmod +x $d/aidl $d/aidl.real
            fi
          done

          echo "=== CHECK FINALE ==="
          ls $P4A/build-tools/
          $P4A/build-tools/34.0.0/aidl
          echo "Exit code aidl: $? (deve essere 0)"

          # Re-patch pip perché buildozer ha ricreato i file
          find ~/.buildozer -type f -name "*.py" -exec sed -i 's/pip install -U pip/pip install pip==24.0/g' {} \; 2>/dev/null || true
          find .buildozer -type f -name "*.py" -exec sed -i 's/pip install -U pip/pip install pip==24.0/g' {} \; 2>/dev/null || true

          # --- 5. BUILD FINALE SENZA --verbose (per non superare 27k righe) ---
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
