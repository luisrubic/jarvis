name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fix buildozer.spec per evitare Build-Tools 37
        run: |
          # se non hai buildozer.spec, crealo
          [ -f buildozer.spec ] || buildozer init || true
          # forza API 34 e build-tools 34.0.0 (quello che non chiede licenza 37)
          sed -i 's/^android.api =.*/android.api = 34/' buildozer.spec || echo "android.api = 34" >> buildozer.spec
          if grep -q "build_tools_version" buildozer.spec; then
            sed -i 's/^#*.*build_tools_version.*/android.build_tools_version = 34.0.0/' buildozer.spec
          else
            echo "android.build_tools_version = 34.0.0" >> buildozer.spec
          fi
          echo "--- buildozer.spec fixato ---"
          grep -E "android.api|build_tools_version|title|source.include" buildozer.spec | head -20

      - name: Build APK con Action già pronta
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: .
          command: buildozer android debug
          buildozer_version: master

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
