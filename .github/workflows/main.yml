name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4 # Versione stabile raccomandata

      - name: Fix buildozer.spec
        run: |
          [ -f buildozer.spec ] || buildozer init || true
          # Forziamo le versioni stabili di Android SDK e Build Tools nel file .spec
          sed -i 's/^#* *android.api =.*/android.api = 34/' buildozer.spec
          sed -i 's/^#* *android.minapi =.*/android.minapi = 21/' buildozer.spec
          sed -i 's/^#* *android.build_tools_version =.*/android.build_tools_version = 34.0.0/' buildozer.spec

      - name: Build APK inside Docker
        run: |
          cat > build_inside_docker.sh <<'EOS'
          #!/bin/bash
          set -e

          # Definiamo i percorsi dell'SDK dentro l'ambiente Docker
          SDK_DIR="/home/user/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/licenses"

          # Accettiamo preventivamente le licenze Android SDK per evitare blocchi
          echo -e "\n247ae265540dd1fd7c74569de43369a4d265d4f8\n28a217817531bbde53e6274abc1bda92fd36f2a4" > "$SDK_DIR/licenses/android-sdk-license"
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" >> "$SDK_DIR/licenses/android-sdk-license"

          # Installiamo le librerie a 32-bit richieste dallo strumento aidl di Android
          echo "=== Install 32bit libs per aidl ==="
          dpkg --add-architecture i386 || true
          apt-get update -y
          apt-get install -y libc6:i386 libstdc++6:i386 zlib1g:i386

          # Avviamo la compilazione pulita. Avendo forzato la 34.0.0 nel file .spec,
          # Buildozer userà gli strumenti nativi stabili senza toccare la versione 37.0.0.
          echo "=== Avvio Compilazione APK ==="
          buildozer android debug
          EOS
          
          chmod +x build_inside_docker.sh

          # Eseguiamo lo script dentro il container ufficiale di Buildozer
          docker run --rm \
            -v $PWD:/home/user/hostcwd \
            -w /home/user/hostcwd \
            --entrypoint bash \
            kivy/buildozer:latest \
            ./build_inside_docker.sh

          # Correggiamo i permessi dei file generati per permettere a GitHub di leggerli
          sudo chown -R $USER:$USER bin 2>/dev/null || true
          ls -lh bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4 # Versione stabile raccomandata
        with:
          name: jarvis-apk
          path: bin/*.apk
