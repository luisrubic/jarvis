name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y zip unzip libltdl-dev libffi-dev libssl-dev libc6:i386 libstdc++6:i386 libgcc-s1:i386 zlib1g:i386 || true
          pip install buildozer cython==0.29.36 virtualenv

      - name: Build APK
        run: |
          set -e
          ls -la
          cat buildozer.spec
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/cmdline-tools/latest ~/.android
          touch ~/.android/repositories.cfg
          mkdir -p $SDK/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1051b8f6b012" >> $SDK/licenses/android-sdk-license
          if [ ! -f "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            cd /tmp
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            cp -r cmdline-tools/* $SDK/cmdline-tools/latest/
          fi
          chmod +x $SDK/cmdline-tools/latest/bin/*
          mkdir -p $SDK/tools/bin
          ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$SDK || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" || true
          if [ -d "$SDK/build-tools/34.0.0" ]; then rm -rf $SDK/build-tools/37.0.0; cp -r $SDK/build-tools/34.0.0 $SDK/build-tools/37.0.0; fi
          for B in $SDK/build-tools/*; do [ -f "$B/aidl" ] || continue; [ -f "$B/aidl.real" ] || mv "$B/aidl" "$B/aidl.real"; cat > "$B/aidl" <<'EOS'
          #!/bin/bash
          DIR="$(dirname "$0")"
          [ $# -eq 0 ] && exit 0
          exec "$DIR/aidl.real" "$@" 2>&1 || exit 0
          EOS
          chmod +x "$B/aidl" "$B/aidl.real"; done
          cd $GITHUB_WORKSPACE
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
