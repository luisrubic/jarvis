name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libtool libtool-bin autoconf automake cmake pkg-config libffi-dev libssl-dev libltdl-dev libtinfo5

      - name: Install Buildozer
        run: |
          pip install --upgrade pip==24.0
          pip install buildozer cython==0.29.36

      - name: Fix buildozer.spec + Use System SDK
        run: |
          # Aggiunge api 34 se manca
          grep -q "android.api" buildozer.spec || echo "android.api = 34" >> buildozer.spec
          sed -i 's/android.api = 33/android.api = 34/g' buildozer.spec || true
          grep -q "android.minapi" buildozer.spec || echo "android.minapi = 24" >> buildozer.spec
          cat buildozer.spec | grep android
          
          rm -rf ~/.buildozer .buildozer bin
          buildozer init || true
          
          # FIX PIP 26
          buildozer android p4a -- --help || true
          find ~/.buildozer -type f -name "*.py" | xargs sed -i 's/pip install -U pip/pip install pip==24.0/g' 2>/dev/null || true

          # FORZA USO SDK DI SISTEMA (che ha già aidl)
          SYS=/usr/local/lib/android/sdk
          P4A=~/.buildozer/android/platform/android-sdk
          mkdir -p $(dirname $P4A)
          rm -rf $P4A
          ln -s $SYS $P4A
          
          echo "Using system SDK: $SYS"
          ls $SYS/build-tools/ | tail -5
          ls $SYS/build-tools/34.0.0/aidl && echo "AIDL TROVATO" || ls $SYS/build-tools/37.0.0/aidl && echo "AIDL TROVATO 37"
          ls $SYS/platforms/

      - name: Build APK
        env:
          ANDROIDAPI: "34"
          ANDROIDSDK: "/usr/local/lib/android/sdk"
          ANDROIDNDK: "/usr/local/lib/android/sdk/ndk/27.3.13750724"
          ANDROIDNDKVER: "27.3.13750724"
        run: buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
