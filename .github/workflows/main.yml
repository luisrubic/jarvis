name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libtool libtool-bin autoconf automake cmake pkg-config libffi-dev libssl-dev libtinfo5 libc6-i386 lib32stdc++6 lib32z1

      - name: Install Buildozer
        run: |
          pip install --upgrade pip==24.0
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          set -e
          sed -i 's/^android.api =.*/android.api = 34/' buildozer.spec || echo "android.api = 34" >> buildozer.spec
          rm -rf .buildozer bin
          buildozer init || true

          P4A=~/.buildozer/android/platform/python-for-android
          SDK=~/.buildozer/android/platform/android-sdk

          # --- PRIMO AVVIO per scaricare p4a e SDK ---
          buildozer android debug || echo "primo avvio fallito ok"

          # --- PATCH PIP ROTTO - QUESTO E' IL FIX ---
          echo "Patching p4a..."
          if [ -d "$P4A" ]; then
            # 1. Disabilita completamente upgrade pip
            find $P4A -type f -name "build.py" -exec sed -i 's/Upgrade pip to latest version/SKIP pip upgrade/g' {} \; 2>/dev/null || true
            find $P4A -type f -name "build.py" -exec sed -i 's/shprint(sh.bash.*pip install -U pip.*/        print("SKIP pip upgrade")\n        continue/g' {} \; 2>/dev/null || true
            find $P4A -type f -name "*.py" -exec sed -i 's/pip install -U pip/echo SKIP pip/g' {} \; 2>/dev/null || true
            find $P4A -type f -name "*.py" -exec sed -i 's/pip install pip==24.0/echo SKIP pip/g' {} \; 2>/dev/null || true
            
            # 2. Patch diretto file build.py (riga 880 circa)
            BUILD_PY="$P4A/pythonforandroid/build.py"
            if [ -f "$BUILD_PY" ]; then
              # Sostituisce il blocco che fa pip install -U pip
              sed -i 's/source venv\/bin\/activate && pip install.*/source venv\/bin\/activate \&\& echo SKIP pip upgrade/g' "$BUILD_PY" || true
            fi
          fi

          # Cancella venv rotto con pip 26
          rm -rf ~/.buildozer/android/platform/build-*/build/venv
          rm -rf .buildozer/android/platform/build-*/build/venv

          # --- FIX SDK ---
          mkdir -p $SDK/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/android-sdk-license
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          rm -rf $SDK/build-tools/37.* $SDK/build-tools/36.* $SDK/build-tools/35.*
          if [ ! -d "$SDK/build-tools/34.0.0" ]; then
            cp -r /usr/local/lib/android/sdk/build-tools/34.0.0 $SDK/build-tools/ 2>/dev/null || true
          fi

          for d in $SDK/build-tools/*; do
            if [ -f "$d/aidl" ] && [ ! -f "$d/aidl.real" ]; then
              mv $d/aidl $d/aidl.real
              printf '#!/bin/bash\nDIR="$(dirname "$0")"\nif [ $# -eq 0 ]; then exit 0; fi\nexec "$DIR/aidl.real" "$@"\n' > $d/aidl
              chmod +x $d/aidl $d/aidl.real
            fi
          done

          echo "=== FINAL CHECK ==="
          ls $SDK/build-tools/
          $SDK/build-tools/34.0.0/aidl; echo "AIDL exit: $?"

          # --- BUILD FINALE SENZA --verbose ---
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
