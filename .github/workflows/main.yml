name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libtool libtool-bin autoconf automake cmake pkg-config libffi-dev libssl-dev libtinfo5 libc6-i386 lib32stdc++6 lib32z1

      - name: Install Buildozer
        run: |
          pip install --upgrade pip==24.0
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          set -e
          sed -i 's/^android.api =.*/android.api = 34/' buildozer.spec || echo "android.api = 34" >> buildozer.spec
          rm -rf .buildozer bin
          buildozer init || true

          P4A=~/.buildozer/android/platform/python-for-android
          SDK=~/.buildozer/android/platform/android-sdk

          # Primo avvio per scaricare SDK (fallisce ed è ok)
          buildozer android debug || true

          # --- FIX PIP 26 ---
          if [ -d "$P4A" ]; then
            find $P4A -type f -name "*.py" -exec sed -i 's/pip install -U pip/echo SKIP pip/g' {} \; 2>/dev/null || true
            find $P4A -type f -name "*.py" -exec sed -i 's/pip install pip==24.0/echo SKIP pip/g' {} \; 2>/dev/null || true
            sed -i 's/source venv\/bin\/activate && pip install.*/source venv\/bin\/activate \&\& echo SKIP pip upgrade/g' $P4A/pythonforandroid/build.py 2>/dev/null || true
          fi
          rm -rf ~/.buildozer/android/platform/build-*/build/venv
          rm -rf .buildozer/android/platform/build-*/build/venv

          # --- FIX SDK ---
          mkdir -p $SDK/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/android-sdk-license
          echo "79120722343a6f314e0719f86303653b55555b55" > $SDK/licenses/android-sdk-preview-license || true

          # Installa esplicitamente build-tools 34.0.0
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" "platform-tools" 2>&1 | tail -20 || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

          echo "=== CERCO BUILD-TOOLS ==="
          find $SDK -type d -name "build-tools" | head -5
          ls -R $SDK/build-tools 2>&1 | head -100 || ls -R ~/.buildozer/android/platform/android-sdk 2>&1 | grep -i aidl | head -20

          # Trova aidl ovunque sia e patchalo
          echo "=== PATCH AIDL OVUNQUE ==="
          find $SDK -name aidl -type f 2>/dev/null | while read AIDL_PATH; do
            echo "Trovato aidl: $AIDL_PATH"
            if [ -f "$AIDL_PATH" ] && [ ! -f "$AIDL_PATH.real" ]; then
              mv "$AIDL_PATH" "$AIDL_PATH.real"
              printf '#!/bin/bash\nDIR="$(dirname "$0")"\nif [ $# -eq 0 ]; then exit 0; fi\nexec "$DIR/aidl.real" "$@"\n' > "$AIDL_PATH"
              chmod +x "$AIDL_PATH" "$AIDL_PATH.real"
              echo "Patchato: $AIDL_PATH"
            fi
          done

          # Test
          find $SDK -name aidl -type f -exec ls -lh {} \; 2>/dev/null
          find $SDK -name aidl -type f -exec {} \; -exec echo " exit:$?" \; 2>/dev/null | head -20 || true

          echo "=== BUILD FINALE ==="
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
