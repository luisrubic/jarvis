name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libtool libtool-bin autoconf automake cmake pkg-config libffi-dev libssl-dev libltdl-dev libtinfo5

      - name: Install Buildozer
        run: |
          pip install --upgrade pip==24.0
          pip install buildozer cython==0.29.36

      - name: Fix buildozer.spec + SDK
        run: |
          echo "--- buildozer.spec PRIMA ---"
          cat buildozer.spec | grep android || true
          
          # AGGIUNGI android.api = 34 se non esiste
          if ! grep -q "android.api" buildozer.spec; then
            echo "android.api = 34" >> buildozer.spec
          else
            sed -i 's/android.api = 33/android.api = 34/g' buildozer.spec
          fi
          
          # Assicurati anche minapi
          if ! grep -q "android.minapi" buildozer.spec; then
            echo "android.minapi = 24" >> buildozer.spec
          fi
          
          echo "--- buildozer.spec DOPO ---"
          cat buildozer.spec | grep android

          rm -rf ~/.buildozer .buildozer bin
          buildozer init || true
          buildozer android p4a -- --help || true
          find ~/.buildozer -type f -name "*.py" | xargs sed -i 's/pip install -U pip/pip install pip==24.0/g' 2>/dev/null || true

          P4A=~/.buildozer/android/platform/android-sdk
          SYS=/usr/local/lib/android/sdk
          mkdir -p $P4A/licenses
          cp $SYS/licenses/* $P4A/licenses/ 2>/dev/null || true
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $P4A/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $P4A/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea4b324" >> $P4A/licenses/android-sdk-license
          
          mkdir -p $P4A/build-tools $P4A/platforms $P4A/platform-tools
          cp -r $SYS/build-tools/* $P4A/build-tools/ || true
          cp -r $SYS/platforms/* $P4A/platforms/ || true
          cp -r $SYS/platform-tools/* $P4A/platform-tools/ || true
          
          ls $P4A/platforms/

      - name: Build APK
        env:
          ANDROIDAPI: "34"
        run: buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
