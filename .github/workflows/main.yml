name: Build APK

on:
  push:
    branches: [ main ]

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip==24.0
          pip install buildozer cython==0.29.36

      - name: Init p4a and Patch pip + sdkmanager
        run: |
          buildozer init || true
          buildozer android p4a -- --help || true
          
          # 1. Patch pip bug
          find ~/.buildozer -name build.py -type f -exec sed -i 's/pip install -U pip/pip install pip==24.0/g' {} \;
          find ~/.buildozer -name build.py -type f -exec sed -i 's/pip install --upgrade pip/pip install pip==24.0/g' {} \;
          
          # 2. FIX sdkmanager path - questo è quello che ti manca ora
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ls -l ~/.buildozer/android/platform/android-sdk/tools/bin/
          echo "Fixed sdkmanager"

      - name: Build APK
        run: |
          buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jarvis-apk
          path: bin/*.apk
          if-no-files-found: error
